services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anxionos
      POSTGRES_PASSWORD: anxionos
      POSTGRES_DB: anxionos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anxionos"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pgdata:
