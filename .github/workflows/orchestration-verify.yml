name: Orchestration verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  orchestration-verify:
    name: Orchestration CLI (offline OK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install root dependencies
        run: npm install

      # ANX-506: orchestration tests import backend packages (contracts/zod).
      # Root npm install alone leaves workspace deps unresolved in CI.
      - name: Install backend workspace dependencies
        working-directory: backend
        run: bun install

      - name: orchestration:verify
        run: npm run orchestration:verify
