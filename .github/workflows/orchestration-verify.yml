name: Orchestration verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  orchestration-verify:
    name: Orchestration CLI (offline OK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install root dependencies
        run: npm install

      # ANX-506: orchestration tests import backend packages (contracts/zod).
      # Root npm install alone leaves workspace deps unresolved in CI.
      - name: Install backend workspace dependencies
        working-directory: backend
        run: bun install

      - name: orchestration:verify
        run: npm run orchestration:verify
