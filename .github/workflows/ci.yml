name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docs-phase:
    name: Repository sanity (docs phase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Required project files
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f package.json
          test -d .archify/specs
          test -d .graphify
          test -f .graphify/VERSION
          echo "anxionOS: estrutura mínima do repositório público OK (brain/ é local)."

      - name: Install toolchain (Archify vendor)
        run: npm install

      - name: Archify specs (showcase validation)
        run: npm run archify:check

      - name: Graphify toolchain (doctor + AST index)
        run: npm run graphify:check

  frontend-build:
    name: Frontend build (P07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Dependency boundaries (depcruise)
        working-directory: backend
        run: bun run boundaries

      - name: Run backend tests
        working-directory: backend
        run: |
          bun run test:boundary
          bun test

  backend-pg-fresh:
    name: Backend tests (fresh PostgreSQL, ANX-463 oracle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg16
        env:
          POSTGRES_USER: anxionos
          POSTGRES_PASSWORD: anxionos
          POSTGRES_DB: anxionos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anxionos -d anxionos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://anxionos:anxionos@localhost:5432/anxionos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      # ANX-463: creates a database from zero, applies every module migration and
      # runs the full suite. Fails unless the summary is 0 fail AND 0 skip, so the
      # suite can never go green again only because the dev database drifted.
      - name: Fresh database oracle
        working-directory: backend
        run: bun run test:pg:fresh --json
