name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docs-phase:
    name: Repository sanity (docs phase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Required project files
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f package.json
          test -d .archify/specs
          test -d .graphify
          test -f .graphify/VERSION
          echo "anxionOS: estrutura mínima do repositório público OK (brain/ é local)."

      - name: Install toolchain (Archify vendor)
        run: npm install

      - name: Archify specs (showcase validation)
        run: npm run archify:check

      - name: Graphify toolchain (doctor + AST index)
        run: npm run graphify:check

  frontend-build:
    name: Frontend build (P07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Dependency boundaries (depcruise)
        working-directory: backend
        run: bun run boundaries

      - name: Run backend tests
        working-directory: backend
        run: |
          bun run test:boundary
          bun test
